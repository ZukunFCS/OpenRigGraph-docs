name: Public documentation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: python -m pip install -r docs/requirements.txt
      - run: python tools/docs/check_public.py
      - run: python -m sphinx -n -W -b html -d docs/build/doctrees docs/source docs/build/html
      - run: python tools/docs/check_public.py --rendered docs/build/html
      - name: Include agent indexes at the site root
        run: |
          cp llms.txt llms-full.txt docs/build/html/
          cp docs/source/_generated/node_catalog.json docs/build/html/node_catalog.json
          touch docs/build/html/.nojekyll
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-html
          path: docs/build/html
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: docs/build/html
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: docs
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
